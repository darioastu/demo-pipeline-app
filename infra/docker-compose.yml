# Entorno local: Jenkins (con acceso a Docker) + SonarQube
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports: ["8080:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-outside-of-Docker
    group_add: ["${DOCKER_GID:-999}"]
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports: ["9000:9000"]
    volumes: [sonar_data:/opt/sonarqube/data]
volumes:
  jenkins_home:
  sonar_data:
